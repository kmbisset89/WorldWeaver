name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release tagged with the Compose Desktop packageVersion
        type: boolean
        default: true

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read Compose Desktop package version
        id: package-version
        run: |
          VERSION="$(./gradlew -q printPackageVersion --console=plain --no-daemon | tail -n 1 | tr -d '[:space:]')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Compose Desktop packageVersion: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Compose Desktop packageVersion: $VERSION"

      - name: Run tests
        run: ./gradlew test --no-daemon

  package-windows:
    name: Package Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package Windows installer
        run: .\gradlew.bat packageReleaseExe --no-daemon

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v4
        with:
          name: worldweaver-windows-exe
          path: build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS (.dmg)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package macOS disk image
        run: ./gradlew packageReleaseDmg --no-daemon

      - name: Upload macOS .dmg
        uses: actions/upload-artifact@v4
        with:
          name: worldweaver-macos-dmg
          path: build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  package-linux:
    name: Package Linux (.deb)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package Linux installer
        run: ./gradlew packageReleaseDeb --no-daemon

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: worldweaver-linux-deb
          path: build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - test
      - package-windows
      - package-macos
      - package-linux
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.publish_release == 'true') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows .exe
        uses: actions/download-artifact@v4
        with:
          name: worldweaver-windows-exe
          path: dist/windows

      - name: Download macOS .dmg
        uses: actions/download-artifact@v4
        with:
          name: worldweaver-macos-dmg
          path: dist/macos

      - name: Download Linux .deb
        uses: actions/download-artifact@v4
        with:
          name: worldweaver-linux-deb
          path: dist/linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.package_version }}
          name: WorldWeaver ${{ needs.test.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/windows/*
            dist/macos/*
            dist/linux/*
          generate_release_notes: true
