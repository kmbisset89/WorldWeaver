name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bump_level:
        description: SemVer bump on main (always a final vX.Y.Z)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    if: >-
      github.event_name != 'push' ||
      github.actor != 'github-actions[bot]' ||
      !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      semver: ${{ steps.ver.outputs.semver }}
      package_version: ${{ steps.ver.outputs.package_version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_final: ${{ steps.ver.outputs.is_final }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump final version
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER_GIT_USER: x-access-token
        run: |
          set -euo pipefail
          BUMP_LEVEL="${{ github.event.inputs.bump_level || 'patch' }}"
          if [[ "${{ github.event_name }}" == "push" ]] && \
             git describe --exact-match --tags HEAD >/dev/null 2>&1 && \
             git describe --exact-match --tags HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already a final tag; skipping bump"
            exit 0
          fi
          ./gradlew bumpVersion --no-daemon \
            -PbumpLevel="${BUMP_LEVEL}" \
            -PisFinal=true

      - name: Read SemVer
        id: ver
        run: |
          SEMVER="$(./gradlew -q printVersion --console=plain --no-daemon | tail -n 1 | tr -d '[:space:]')"
          PACKAGE="$(./gradlew -q printPackageVersion --console=plain --no-daemon | tail -n 1 | tr -d '[:space:]')"
          if [[ ! "$PACKAGE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Compose Desktop packageVersion: '$PACKAGE' (semver '$SEMVER')"
            exit 1
          fi
          if [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_FINAL=true
          else
            IS_FINAL=false
          fi
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "tag=v$SEMVER" >> "$GITHUB_OUTPUT"
          echo "is_final=$IS_FINAL" >> "$GITHUB_OUTPUT"
          echo "SemVer: $SEMVER"
          echo "packageVersion: $PACKAGE"
          echo "tag: v$SEMVER"
          echo "final: $IS_FINAL"

  test:
    name: Test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

  package-windows:
    name: Package Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package Windows installer
        run: .\gradlew.bat packageReleaseExe --no-daemon

      - name: Upload Windows .exe
        uses: actions/upload-artifact@v4
        with:
          name: worldweaver-windows-exe
          path: build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS (.dmg)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package macOS disk image
        run: ./gradlew packageReleaseDmg --no-daemon

      - name: Upload macOS .dmg
        uses: actions/upload-artifact@v4
        with:
          name: worldweaver-macos-dmg
          path: build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  package-linux:
    name: Package Linux (.deb)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package Linux installer
        run: ./gradlew packageReleaseDeb --no-daemon

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: worldweaver-linux-deb
          path: build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - version
      - package-windows
      - package-macos
      - package-linux
    if: >-
      needs.version.outputs.is_final == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows .exe
        uses: actions/download-artifact@v4
        with:
          name: worldweaver-windows-exe
          path: dist/windows

      - name: Download macOS .dmg
        uses: actions/download-artifact@v4
        with:
          name: worldweaver-macos-dmg
          path: dist/macos

      - name: Download Linux .deb
        uses: actions/download-artifact@v4
        with:
          name: worldweaver-linux-deb
          path: dist/linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: WorldWeaver ${{ needs.version.outputs.semver }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/windows/*
            dist/macos/*
            dist/linux/*
